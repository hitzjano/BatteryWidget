name: Release

# Pushing a tag such as v0.1.0 builds the executable and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash target/release/BatteryWidget.exe -Algorithm SHA256).Hash + "  BatteryWidget.exe" | Out-File -Encoding ascii target/release/BatteryWidget.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install (PowerShell)

            ```powershell
            irm https://raw.githubusercontent.com/hitzjano/BatteryWidget/main/install.ps1 | iex
            ```

            Or download `BatteryWidget.exe` below and run it.
          files: |
            target/release/BatteryWidget.exe
            target/release/BatteryWidget.exe.sha256
